# Deliberately broken sample for the status diagnosis tests (docs/mvp.md section 7): requests more GPUs than the node has
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: unschedulable
spec:
  predictor:
    model:
      modelFormat:
        name: sklearn
      storageUri: gs://kfserving-examples/models/sklearn/1.0/model
      resources:
        limits:
          nvidia.com/gpu: "8"
