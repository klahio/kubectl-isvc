# Deliberately broken sample (docs/mvp.md section 7): examples/llmisvc-smollm.yaml without the TRITON_LIBCUDA_PATH
# override. On an Ubuntu node vLLM then crashes with "ld: cannot find -l:libcuda.so.1", and its last log line only says
# "Engine core initialization failed". Uses one time-sliced GPU slot while it restarts; delete it after testing.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: llm-libcuda
spec:
  model:
    uri: hf://HuggingFaceTB/SmolLM2-135M-Instruct
    name: HuggingFaceTB/SmolLM2-135M-Instruct
  replicas: 1
  template:
    runtimeClassName: nvidia
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: "--gpu-memory-utilization=0.3 --max-model-len=4096"
        resources:
          limits:
            nvidia.com/gpu: "1"
