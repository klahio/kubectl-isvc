apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kserve
spec:
  version: {{ .TagName }}
  homepage: https://github.com/klahio/kubectl-kserve
  shortDescription: Diagnose, smoke-test and read logs of KServe model services
  description: |
    A KServe InferenceService or LLMInferenceService fans out into a serving
    runtime, Deployments,
    pods with a model-download init container, Services, an Ingress or Gateway
    API routes, and an autoscaler. When a model is not serving, the cause is
    usually several objects away, and KServe's own Ready reason often points
    somewhere else (for example "Predictor ingress not created" when the pod
    is out of memory).

    This plugin follows that chain for you and names the common causes:
    a failed model download, an image that cannot be pulled, a crash or an
    out-of-memory kill, a pod that cannot be scheduled, a model format without
    a runtime, or an external address that cannot be reached. For vLLM
    servers it searches the crash log for the actual cause, because the last
    line rarely says it. It also sends a smoke-test request (an OpenAI chat
    prompt for language models) without you knowing the address or the
    protocol, falling back to port-forward when the model is not exposed. And
    it shows the right container logs without pod names.

    Supports KServe v0.16 to v0.21: InferenceServices in Standard mode, with
    Ingress or Gateway API, including canary rollouts, and LLMInferenceServices.
    Read-only: it never changes the cluster.
  caveats: |
    This is a community plugin, not part of the KServe project. It supports
    KServe's Standard deployment mode only (not Knative serverless).
    The plugin only reads cluster objects. `kubectl kserve test` also needs
    permission to create pods/portforward when it falls back to port-forward.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/klahio/kubectl-kserve/releases/download/{{ .TagName }}/kubectl-kserve_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    files:
    - from: kubectl-kserve
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-kserve
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/klahio/kubectl-kserve/releases/download/{{ .TagName }}/kubectl-kserve_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
    files:
    - from: kubectl-kserve
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-kserve
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/klahio/kubectl-kserve/releases/download/{{ .TagName }}/kubectl-kserve_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    files:
    - from: kubectl-kserve
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-kserve
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/klahio/kubectl-kserve/releases/download/{{ .TagName }}/kubectl-kserve_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    files:
    - from: kubectl-kserve
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-kserve
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/klahio/kubectl-kserve/releases/download/{{ .TagName }}/kubectl-kserve_{{ .TagName }}_windows_amd64.zip" .TagName }}
    files:
    - from: kubectl-kserve.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-kserve.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{addURIAndSha "https://github.com/klahio/kubectl-kserve/releases/download/{{ .TagName }}/kubectl-kserve_{{ .TagName }}_windows_arm64.zip" .TagName }}
    files:
    - from: kubectl-kserve.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-kserve.exe
